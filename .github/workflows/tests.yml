name: Milestone 2 requirement verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify all implementation and coursework checks
        run: python -m pytest -v -rs --junitxml=evidence/ci.xml
      - name: Generate coursework role observations
        run: python scripts/coursework_exercise.py
      - name: Describe verification scope
        if: always()
        run: echo 'AI-authored role protocols exercise real application responses. Method and limitations are in SPEC.md. These are not recruited human trials or cloud-model approval.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone2-verification
          path: |
            evidence/*.xml
            evidence/acceptance/coursework-role-report.json
