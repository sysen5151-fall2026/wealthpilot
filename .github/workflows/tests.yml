name: Task 2 stakeholder-need acceptance tests

on:
  push:
  pull_request:

jobs:
  task2-acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest

      - name: Run stakeholder-need acceptance tests
        run: pytest tests/test_spec_acceptance.py -v
