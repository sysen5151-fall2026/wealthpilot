<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WealthPilot</title>
  <meta name="description" content="Educational investment-planning simulator. No real trade is placed and no money moves.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23A3195B' stroke-width='4'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%2318324A'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <p class="scope-band" id="scope-band" role="note">Educational simulation only. No real trade is placed and no money moves.</p>

  <header class="masthead">
    <a class="wordmark" href="#" data-nav="planner">WealthPilot</a>
    <nav class="masthead-nav" aria-label="Main">
      <button type="button" class="nav-link" data-nav="planner" aria-current="page">Plan</button>
      <button type="button" class="nav-link" data-nav="saved">Saved plans</button>
    </nav>
  </header>

  <main id="main" tabindex="-1">
    <noscript><p class="notice">WealthPilot needs JavaScript to run in this browser.</p></noscript>
  </main>

  <details class="trace" id="trace">
    <summary>How this plan was built <span class="trace-hint">model trace, F.x | C.x</span></summary>
    <p class="trace-intro">Each line is one step of UC.1: the function on the IDEF0 diagram, the asset that performs it, and the flow it produced.</p>
    <ol class="trace-list" id="trace-list"></ol>
  </details>

  <footer class="colophon" id="colophon"></footer>
</body>
</html>
